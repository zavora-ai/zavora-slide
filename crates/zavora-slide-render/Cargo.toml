[package]
name = "zavora-slide-render"
description = "Slide rasterization (PNG/SVG) for PresentationML presentations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["bundled-fonts"]
## Embed LiberationSans (Arial-metric-compatible) so PNG renders on fontless hosts.
bundled-fonts = []

[dependencies]
zavora-slide-layout = { workspace = true }
thiserror = { workspace = true }
base64 = "0.22"
resvg = "0.45.1"
